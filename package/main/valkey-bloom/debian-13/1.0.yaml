# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-valkey-bloom
variant: runtime
tags:
  - 1.0.1
  - 1.0.1-r1
  - 1.0.1-debian13
  - 1.0.1-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-01"
vars:
  CARGO_VERSION: 1.98.1-0
  COMMIT_SHA: 43b4e704bc8d6bd5f65529c8bd7e8488f2d54080
  REL: "1"
  RUSTC_VERSION: 1.98.1-0
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.1
  VERSION: 1.0.1
contents:
  packages:
    - base-files
  builds:
    - name: valkey-bloom
      work-dir: ${source.dir}/valkey-bloom
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - cargo-1.98=1.98.1-0
          - coreutils
          - findutils
          - gcc
          - git
          - libc6-dev
          - libclang-dev
          - libsqlite3-0
          - libstdc++6
          - rustc-1.98=1.98.1-0
        files:
          - url: git+https://github.com/valkey-io/valkey-bloom.git#1.0.1
            checksum: 43b4e704bc8d6bd5f65529c8bd7e8488f2d54080
            path: ${source.dir}/valkey-bloom
            spdx:
              name: valkey-bloom
              version: 1.0.1
              packages:
                - name: valkey-bloom
                  purl: pkg:github/valkey-io/valkey-bloom@1.0.1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo build --release

            mkdir -p "${target.dir}/usr/lib/valkey"
            cp target/release/libvalkey_bloom.so "${target.dir}/usr/lib/valkey/libvalkey_bloom.so"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
            description: Bloom filter and other probabilistic data structure support for Valkey
            files:
              - usr/lib/valkey
            formats:
              - deb
            license: BSD-3-Clause
            name: valkey-bloom
            rel: 1
            url: https://github.com/valkey-io/valkey-bloom
            version: 1.0.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
