        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo build --release

            mkdir -p "${target.dir}/usr/lib/valkey"
            cp target/release/libvalkey_ldap.so "${target.dir}/usr/lib/valkey/libvalkey_ldap.so"
        - uses: dhi/build-pkg:0
