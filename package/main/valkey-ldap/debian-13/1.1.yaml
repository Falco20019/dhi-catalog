      work-dir: ${source.dir}/valkey-ldap
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - cargo-1.98=1.98.1-0
          - coreutils
          - findutils
          - gcc
          - git
          - libc6-dev
          - libclang-dev
          - libsqlite3-0
          - libssl-dev
          - libstdc++6
          - pkg-config
          - rustc-1.98=1.98.1-0
        files:
          - url: git+https://github.com/valkey-io/valkey-ldap.git#1.1.1
            checksum: 46c80e1c5834faf44c7589a993b083e0cad08ef9
            path: ${source.dir}/valkey-ldap
            spdx:
