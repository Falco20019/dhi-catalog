# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-milvus-etcd
variant: runtime
tags:
  - 3.5.30-alpine3.24
  - 3.5.30-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 9047244ff6bc007581ef42054f834d817d6994dc
  PACKAGE_NAME: milvus-etcd
  REL: "0"
  SCRIPTS_VERSION: 3.5.30-r1
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.30
  VERSION: 3.5.30
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: milvus-etcd
      work-dir: /src/bitnami-docker-etcd
      contents:
        packages:
          - busybox
        files:
          - url: git+https://github.com/milvus-io/bitnami-docker-etcd.git#3.5.30-r1
            checksum: 9047244ff6bc007581ef42054f834d817d6994dc
            path: /src/bitnami-docker-etcd
            spdx:
              name: bitnami-docker-etcd
              version: 3.5.30-r1
              packages:
                - name: bitnami-docker-etcd
                  purl: pkg:github/milvus-io/bitnami-docker-etcd@3.5.30-r1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: guard conf chown for root runs
          uses: patch@v1
          with:
            options: -p1
            patch: /src/patch/guard-conf-chown.patch
        - name: stage bitnami scripts and layout
          work-dir: /src/bitnami-docker-etcd/3.5/ubuntu22.04
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/bitnami
            cp -a prebuildfs/opt/bitnami/scripts ${target.dir}/opt/bitnami/scripts
            cp -a rootfs/opt/bitnami/scripts/. ${target.dir}/opt/bitnami/scripts/
            cp -a prebuildfs/opt/bitnami/licenses ${target.dir}/opt/bitnami/licenses

            mkdir -p ${target.dir}/opt/bitnami/common/bin
            ln -s /usr/bin/yq ${target.dir}/opt/bitnami/common/bin/yq

            mkdir -p ${target.dir}/opt/bitnami/etcd/bin
            ln -s /usr/bin/etcd ${target.dir}/opt/bitnami/etcd/bin/etcd
            ln -s /usr/bin/etcdctl ${target.dir}/opt/bitnami/etcd/bin/etcdctl
            ln -s /usr/bin/etcdutl ${target.dir}/opt/bitnami/etcd/bin/etcdutl

            mkdir -p \
              ${target.dir}/opt/bitnami/etcd/conf \
              ${target.dir}/opt/bitnami/etcd/certs \
              ${target.dir}/opt/bitnami/etcd/tmp \
              ${target.dir}/bitnami/etcd \
              ${target.dir}/snapshots
            touch ${target.dir}/opt/bitnami/etcd/conf/.keep \
              ${target.dir}/opt/bitnami/etcd/certs/.keep \
              ${target.dir}/opt/bitnami/etcd/tmp/.keep \
              ${target.dir}/bitnami/etcd/.keep \
              ${target.dir}/snapshots/.keep
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox
                - musl-utils
            depends:
              - bash
            description: Bitnami-compatible etcd startup scripts maintained by the Milvus project
            files:
              - opt/bitnami/etcd/bin
              - opt/bitnami/etcd/conf
              - opt/bitnami/etcd/certs
              - opt/bitnami/etcd/tmp
              - opt/bitnami/scripts
              - opt/bitnami/licenses
              - opt/bitnami/common
              - bitnami
              - snapshots
            license: Apache-2.0
            name: milvus-etcd
            rel: 0
            url: https://github.com/milvus-io/bitnami-docker-etcd
            version: 3.5.30
      paths:
        - type: file
          path: /src/patch/guard-conf-chown.patch
          uid: 0
          gid: 0
          source: package/main/milvus-etcd/patch/guard-conf-chown.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
