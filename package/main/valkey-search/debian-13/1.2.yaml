# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-valkey-search
variant: runtime
tags:
  - 1.2.1
  - 1.2.1-r0
  - 1.2.1-debian13
  - 1.2.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-17"
vars:
  COMMIT_SHA: 788e8c90063abab69d0d3fff32206f8491c633ca
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.2"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.2.1
  VERSION: 1.2.1
contents:
  packages:
    - base-files
  builds:
    - name: valkey-search
      work-dir: ${source.dir}/valkey-search
      environment:
        CMAKE_GENERATOR: Unix Makefiles
      caches:
        - path: /root/.cache
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - build-essential
          - ca-certificates
          - cmake
          - coreutils
          - findutils
          - git
          - grep
          - libssl-dev
          - libtool
          - libsystemd-dev
          - pkg-config
          - python3
          - sed
        files:
          - url: git+https://github.com/valkey-io/valkey-search.git#1.2.1
            checksum: 788e8c90063abab69d0d3fff32206f8491c633ca
            path: ${source.dir}/valkey-search
            spdx:
              name: valkey-search
              version: 1.2.1
              packages:
                - name: valkey-search
                  purl: pkg:github/valkey-io/valkey-search@1.2.1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            ./build.sh --jobs=2

            mkdir -p "${target.dir}/usr/lib/valkey"
            cp .build-release/libsearch.so "${target.dir}/usr/lib/valkey/libsearch.so"
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: grpc
            purl: pkg:github/grpc/grpc@v1.70.1
            version: v1.70.1
        - uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: protobuf
            purl: pkg:github/protocolbuffers/protobuf@v29.0
            version: v29.0
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: abseil-cpp
            purl: pkg:github/abseil/abseil-cpp@20240722.0
            version: 2.0240722e+07
        - uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: re2
            purl: pkg:github/google/re2@2022-04-01
            version: 2022-04-01T00:00:00Z
        - uses: spdx@v1
          with:
            license: MIT
            name: c-ares
            purl: pkg:github/c-ares/c-ares@cares-1_19_1
            version: cares-1_19_1
        - uses: spdx@v1
          with:
            license: Zlib
            name: zlib
            purl: pkg:github/madler/zlib@v1.3
            version: v1.3
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: highwayhash
            purl: pkg:github/google/highwayhash@f8381f3331d9c56a9792f9b4a35f61c41108c39e
            version: f8381f3331d9c56a9792f9b4a35f61c41108c39e
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libssl3t64
              - libstdc++6
            description: Vector search and secondary indexing for Valkey
            files:
              - usr/lib/valkey
            formats:
              - deb
            license: BSD-3-Clause
            name: valkey-search
            rel: 0
            url: https://github.com/valkey-io/valkey-search
            version: 1.2.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
