# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gradle
variant: runtime
tags:
  - 8.14.6-0
  - 8.14.6-0-debian13
platforms:
  - linux/amd64
vars:
  COMMIT_SHA: 88c80c1459b75a6d077d24eebe7905ffa3e1293f
  DHI_REL: "0"
  DHI_VERSION: 8.14.6-0
  JDK_MAJOR_VERSION: "17"
  JDK_VERSION: 17.0.19.10-0
  PACKAGE_NAME: gradle-8
  SEMVER_MAJOR_VERSION: "8"
  VERSION: 8.14.6
contents:
  packages:
    - '!base-files'
  builds:
    - name: gradle-8 deb
      work-dir: ${source.dir}/gradle
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - debhelper
          - dpkg-dev
          - eclipse-temurin-17-jdk=17.0.19.10-0
          - git
          - quilt
          - unzip
        files:
          - url: git+https://github.com/gradle/gradle.git#v8.14.6
            checksum: 88c80c1459b75a6d077d24eebe7905ffa3e1293f
            path: ${source.dir}/gradle
            uid: 0
            gid: 0
      pipeline:
        - name: setup
          runs: |
            set -eux -o pipefail

            sed -i -e "s/@PACKAGE_NAME@/gradle-8/g" \
              -e "s/@VERSION@/8.14.6/g" \
              -e "s/@SEMVER_MAJOR_VERSION@/8/g" \
              -e "s/@JDK_MAJOR_VERSION@/17/g" \
              debian/control.in debian/changelog debian/gradle.install.in debian/rules
            mv debian/control.in debian/control
            mv debian/gradle.install.in "debian/gradle-8.install"
            mkdir -p debian/patches
        - uses: patch@v1
          work-dir: ${source.dir}/gradle
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/0002-Update-org.eclipse.jgit-org.eclipse.jgit-7.2.1.2025.patch
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 8.14.6-0
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/gradle/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/gradle/debian-13/debian
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/deb/main/gradle/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
