image: dhi.io/pkg-nmap
variant: runtime
tags:
  - 7.99-alpine3.24
  - 7.99-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "0"
  COMMIT_SHA: a3cac2791b70e9dff6712cf3aafae50a6378517b
  PACKAGE_NAME: main/nmap
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "7.99"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: "7.99"
  VERSION: "7.99"
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/nmap
      contents:
        packages:
          - autoconf
          - automake
          - libtool
          - libpcap-dev
          - libssh2-dev
          - linux-headers
          - lua5.4-dev
          - openssl-dev
          - pcre-dev
          - zlib-dev
        files:
          - url: git+https://github.com/alpinelinux/aports.git#a3cac2791b70e9dff6712cf3aafae50a6378517b
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://nmap.org/dist/nmap-7.99.tar.bz2
            path: /var/cache/distfiles/nmap-7.99.tar.bz2
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: register CVE-2026-58058 patch in APKBUILD
          runs: |
            set -eux -o pipefail

            patch=dhi-cve-2026-58058-ipv6-ext-header-underflow.patch
            test -f "${patch}"
            if ! grep -Fq "${patch}" APKBUILD; then
              sed -i "/0001-Fix-build-conflicting-types-for-strlcat.patch/a\\$(printf '\t')${patch}" APKBUILD
            fi
            grep -Fq "${patch}" APKBUILD \
              || {
                echo "ERROR: ${patch} not registered in APKBUILD source="
                exit 1
              }
        - uses: abuild/bump@v1
          with:
            rel: 1
            version: 7.99
        - uses: abuild/build@v1
          with:
            command: checksum
        - uses: abuild/build@v1
          privileged: true
      paths:
        - type: file
          path: ${source.dir}/aports/main/nmap/dhi-cve-2026-58058-ipv6-ext-header-underflow.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/nmap/patch/dhi-cve-2026-58058-ipv6-ext-header-underflow.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
