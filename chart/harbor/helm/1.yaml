vars:
  CHART_COMMIT_SHA: 1b95eb091f73a692634797b3ea15766a6d454d57
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.2-debian13@sha256:dc5c700d3f46eadc4ef23e31deb5b068a4da78cb4a857e12a3005414024bfaa7
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.2-debian13@sha256:62262a9b1292e2caf8ebcd34d1b93d4fef42e43d3bda2fb5908832807ffb0e50
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.2-debian13@sha256:bbad1c35c867c0aa783d7c8a83a240338727f1d3c64749472ec17b08c345a81a
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.2-debian13@sha256:4258ec82f61461c9a0550b452add5d621a02bc00729e5a8ee34425507438b027
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.2-debian13@sha256:7ca22bb127308c8a70521de2d36b014667b3f5d5c71ebbe4c341042d4b98d968
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.2-debian13@sha256:6f7534c52be8f40cb9770cffd6f2110ad23c42a30e82af3b7a922697a93d0bbe
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.2-debian13@sha256:e47e46b44b5e122ad1b45f638e466c85794284e58aa1b3ad61fc94b97de16d4d
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.2-debian13@sha256:1eb777b7747197cfb0f17b49f3ea846eee00dce179a5dfa882fdfeda7c027aa4
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:020ad1d6782a346c4c5e0c9d7e2b3f7715a2127c87a3a981e5641e5f4577ad84
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.5-debian13@sha256:b0165fa0e2c565ddf722ac59b535436b4e87fd054ede7902a9e5b612a9f62d57
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.2
            checksum: 1b95eb091f73a692634797b3ea15766a6d454d57
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.2-debian13@sha256:dc5c700d3f46eadc4ef23e31deb5b068a4da78cb4a857e12a3005414024bfaa7
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.2-debian13@sha256:4258ec82f61461c9a0550b452add5d621a02bc00729e5a8ee34425507438b027
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.2-debian13@sha256:e47e46b44b5e122ad1b45f638e466c85794284e58aa1b3ad61fc94b97de16d4d
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.2-debian13@sha256:1eb777b7747197cfb0f17b49f3ea846eee00dce179a5dfa882fdfeda7c027aa4
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:020ad1d6782a346c4c5e0c9d7e2b3f7715a2127c87a3a981e5641e5f4577ad84
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.2-debian13@sha256:bbad1c35c867c0aa783d7c8a83a240338727f1d3c64749472ec17b08c345a81a
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.2-debian13@sha256:7ca22bb127308c8a70521de2d36b014667b3f5d5c71ebbe4c341042d4b98d968
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.2-debian13@sha256:62262a9b1292e2caf8ebcd34d1b93d4fef42e43d3bda2fb5908832807ffb0e50
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.2-debian13@sha256:6f7534c52be8f40cb9770cffd6f2110ad23c42a30e82af3b7a922697a93d0bbe
                - name: nginx
                  ref: dhi/nginx:1.31.5-debian13@sha256:b0165fa0e2c565ddf722ac59b535436b4e87fd054ede7902a9e5b612a9f62d57
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
