# Docker Hardened Images configuration for Calico 3.33 (tigera-operator chart).
#
# Upstream uses tigeraOperator.{registry,image,version} composed via the
# tigera-operator.image template helper as "<registry>/<image>:<version>".
# We override these to point at the DHI tigera-operator image; <version>
# carries "<tag>@<digest>" so the resolved reference includes the digest.
tigeraOperator:
  registry: ${tigera-operator.registry}
  image: ${tigera-operator.repository}
  version: ${tigera-operator.tag}@${tigera-operator.digest}

# Since 3.33 the calicoctl init container (create-initial-resources) runs from the combined calico image
# (upstream default: quay.io/calico/calico), which ships /usr/bin/calicoctl. calico-ctl is no longer used.
calicoctl:
  image: ${calico-calico.registry}/${calico-calico.repository}
  tag: ${calico-calico.tag}@${calico-calico.digest}

# Calico component images (calico, node, whisker, third-party-cni-plugins) are deployed by the
# operator using installation.{registry,imagePath,imagePrefix}. The operator builds each reference as
# <registry>/<imagePath>/<imagePrefix><component>, with components named calico, node, whisker and
# third-party-cni-plugins. imagePath must be "." so the operator does not insert the upstream default
# path segment "calico/". When mirroring to Docker Hub, set imagePath to your namespace (for example myorg).
installation:
  registry: dhi.io/
  imagePath: .
  imagePrefix: calico-
